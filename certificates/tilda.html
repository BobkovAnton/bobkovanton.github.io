<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#151515">
  <meta name="description" content="Сертификат Школы Тильды, выданный Антону Бобкову в ноябре 2022 года за курс Tilda START.">
  <title>Сертификат Tilda START — Антон Бобков</title>
  <link rel="preload" href="../static/fonts/Onest-Variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./viewer.css?v=3">
  <script src="./viewer.js?v=3" defer></script>
</head>
<body>
  <main class="page">
    <header class="card header">
      <div class="topline">
        <a class="back-link" href="https://bobkovanton.github.io/" aria-label="Вернуться к CV Антона Бобкова">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m14 6-6 6 6 6M8 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span><span class="back-name">Антон Бобков · </span>CV</span>
        </a>
      </div>
      <p class="metadata">Школа Тильды · ноябрь 2022</p>
    </header>
    <section class="card viewer" aria-label="Просмотр сертификата">
      <div class="stage" id="stage" tabindex="0" aria-label="Сертификат. При увеличении изображение можно прокручивать." aria-describedby="viewer-help">
        <div class="canvas" id="canvas">
          <img id="certificate" src="./images/tilda.jpg" width="1447" height="2048" alt="Сертификат Школы Тильды, выданный Антону Бобкову в ноябре 2022 года за курс Tilda START." draggable="false" fetchpriority="high">
        </div>
      </div>
      <div class="toolbar" role="group" aria-label="Масштаб сертификата">
        <button class="icon-button" id="zoom-out" type="button" aria-label="Уменьшить" title="Уменьшить">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <output class="zoom-value" id="zoom-value" aria-live="polite" aria-label="Текущий масштаб">—</output>
        <button class="icon-button" id="zoom-in" type="button" aria-label="Увеличить" title="Увеличить">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
      <p class="sr-only" id="viewer-help">Нажмите на изображение для просмотра в полном размере. Плюс и минус меняют масштаб, ноль показывает сертификат целиком.</p>
    </section>
  </main>
</body>
</html>
