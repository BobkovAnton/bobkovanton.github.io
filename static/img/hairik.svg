<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" aria-hidden="true">
  <defs>
    <linearGradient id="hairikFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#146546"/>
      <stop offset="0.55" stop-color="#3F9778"/>
      <stop offset="1" stop-color="#4DB288"/>
    </linearGradient>
    <clipPath id="hairikStage"><circle cx="40" cy="40" r="40"/></clipPath>
    <style>
      .peek, .eyes, .blink { transform-box: fill-box; transform-origin: center; }
      .peek { animation: peek 6s ease-in-out infinite; }
      .eyes { animation: look 6s ease-in-out infinite; }
      .blink { animation: blink-eyes 6s ease-in-out infinite; }
      @keyframes peek { 0%, 100% { transform: translateY(6px); } 50% { transform: translateY(0); } }
      @keyframes look { 0%, 30% { transform: translate(-3px, 0); } 40%, 70% { transform: translate(3px, -2px); } 80%, 100% { transform: translate(-3px, 0); } }
      @keyframes blink-eyes { 0%, 54%, 60%, 100% { transform: scaleY(1); } 57% { transform: scaleY(0.1); } }
      @media (prefers-reduced-motion: reduce) { .peek, .eyes, .blink { animation: none; } }
    </style>
  </defs>
  <circle cx="40" cy="40" r="40" fill="#DCEFE5"/>
